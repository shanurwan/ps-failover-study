; Local stand-in for PlanetScale's local PgBouncer (port 6432, transaction
; pooling only). The values below are the ones PlanetScale documents as its
; defaults (docs/postgres/connecting/pgbouncer, read 2026-11-22). Anything not
; listed is PgBouncer 1.24's own default. Each run records SHOW CONFIG.
%include /etc/pgbouncer/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = admin
stats_users = admin
max_client_conn = 100
default_pool_size = 20
max_prepared_statements = 200
server_lifetime = 3600
query_wait_timeout = 120
server_check_query = select 1
logfile =
pidfile =
